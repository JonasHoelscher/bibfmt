[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bibfmt"
version = "0.1.3"
description = "Formatting BibTeX files"
readme = "README.md"
authors = [
    { name = "Jonas Hölscher", email = "hoelscher@emt.uni-paderborn.de" }
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
]
keywords = [
    "bibtex", "formatter"
]
dependencies = [
    "tree-sitter",
    "tree-sitter-language-pack"
]

[project.urls]
homepage = "https://ei.uni-paderborn.de/en/emt/home"
source = "https://github.com/JonasHoelscher/bibfmt"

[project.scripts]
bibfmt = "bibfmt:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright"
]
